# Publish proprioceptive-lens to PyPI via Trusted Publishing (OIDC, no long-lived token).
#
# Flow: bump version in pyproject.toml -> create a GitHub Release -> this workflow
# builds the sdist+wheel and publishes them. A token compromise can no longer ship a
# trojaned wheel, because publishing requires a valid OIDC token minted by GitHub
# Actions for THIS repo+trigger (verified by PyPI against the Trusted Publisher below).
#
# One-time PyPI-side setup (see README "Trusted publishing"): add a Trusted Publisher
#   - PyPI project:   proprioceptive-lens
#   - Provider:       GitHub
#   - Owner:          Loganwins
#   - Repository:     ProprioceptiveAI
#   - Workflow file:  publish.yml
#   - Subject:        repository:Loganwins/ProprioceptiveAI
#   - Permission:     Upload a new version
#
name: Publish to PyPI

on:
  release:
    types: [published]
  # manual escape hatch (also uses Trusted Publishing; the OIDC subject must allow it)
  workflow_dispatch:

# id-token:write is REQUIRED for Trusted Publishing (lets the action mint an OIDC token).
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression tests (audit D6: nothing publishes untested)
        run: |
          python -m pip install --upgrade pip pytest numpy
          python -m pytest tests/ -q
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify the wheel has NO proprietary IP (defence in depth)
        # The client must stay IP-free: the steering vectors / dark-head theta are
        # server-side. A 9+ float array in the wheel = inlined IP -> fail the publish.
        run: python scripts/check_ip_leak.py dist
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi        # optional extra gate; create an environment named "pypi" in repo settings
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing — no password, uses OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password` / no PyPI_API_TOKEN on purpose: the action uses the OIDC token
        # (id-token:write) which PyPI verifies against the Trusted Publisher config.
